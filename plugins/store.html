<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>KapiTomo | Plugins</title>
    <meta name="description" content="Official Nyxovira plugins published by Nanquimori.">
    <link rel="canonical" href="https://nanquimori.github.io/KapiTomo/plugins/">
    <meta property="og:site_name" content="KapiTomo">
    <meta property="og:title" content="KapiTomo | Plugins">
    <meta property="og:description" content="Official Nyxovira plugins published by Nanquimori.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nanquimori.github.io/KapiTomo/plugins/">
    <link rel="icon" href="../assets/kapitomo-logo.png">
    <style>
      :root {
        color-scheme: dark;
        --bg: #05030b;
        --panel: rgba(18, 10, 36, 0.9);
        --panel-soft: rgba(14, 7, 28, 0.9);
        --line: rgba(255, 255, 255, 0.14);
        --text: #fff8f1;
        --muted: #bcaecc;
        --faint: #80708f;
        --accent: #ffb21f;
        --accent-2: #ff6b2c;
        --accent-soft: #ffd37a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 0%, rgba(125, 69, 255, 0.2), transparent 22rem),
          linear-gradient(135deg, #06020d 0%, #160926 54%, #090512 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }

      a { color: inherit; text-decoration: none; }
      p, h1, h2, h3 { margin-top: 0; }

      .page {
        width: 100%;
        margin: 0;
        padding: 6px 8px 44px;
      }

      .panel, .plugin-card {
        border: 1px solid var(--line);
        background: var(--panel);
      }

      .topbar {
        min-height: 30px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0;
        margin-bottom: 5px;
      }

      .brand {
        min-width: 0;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand img { width: 22px; height: 22px; border-radius: 6px; }
      .brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .hub-menu {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 15px;
      }

      .menu-tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        border: 0;
        border-radius: 0;
        padding: 1px 0 3px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.72rem;
        font-weight: 850;
        line-height: 1;
        white-space: nowrap;
      }

      .menu-tab:hover, .menu-tab.is-active { color: var(--text); }
      .menu-tab.is-active::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 1px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      .language-switch {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        padding: 3px;
      }

      .language-button {
        min-height: 22px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 0 7px;
        font: inherit;
        font-size: 0.66rem;
        font-weight: 900;
        cursor: pointer;
      }

      .language-button[aria-pressed="true"] {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #170700;
      }

      .button {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 0 10px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--text);
        font-size: 0.82rem;
        font-weight: 850;
        white-space: nowrap;
        cursor: pointer;
      }

      .button.primary {
        border: 0;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #150700;
      }

      .kicker {
        margin: 0 0 3px;
        color: var(--accent-soft);
        font-size: 0.58rem;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h2 { margin-bottom: 0; font-size: 1rem; line-height: 1.05; }
      h3 { margin-bottom: 0; font-size: 0.95rem; line-height: 1.15; }

      .catalog-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
        gap: 6px;
        padding: 0;
        border: 0;
        background: transparent;
      }

      .panel-head { margin-bottom: 2px; }
      .catalog-tools { display: grid; gap: 4px; margin: 0; }
      .catalog-search-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

      .text-input {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0 11px;
        background: rgba(255, 255, 255, 0.055);
        color: var(--text);
        font: inherit;
        font-size: 0.88rem;
        font-weight: 700;
      }

      .catalog-search {
        min-height: 24px;
        width: min(320px, 100%);
        max-width: 320px;
        border-radius: 7px;
        padding: 0 8px;
        font-size: 0.72rem;
      }

      .favorites-toggle {
        min-height: 24px;
        width: auto;
        min-width: max-content;
        border-radius: 7px;
        padding: 0 9px;
        font-size: 0.68rem;
      }

      .favorites-toggle.is-active { border-color: rgba(255, 194, 71, 0.68); color: #ffd990; }
      .filter-head { display: block; }
      .filter-head .kicker { margin-bottom: 0; color: #b68fff; }

      .tag-filter { display: grid; gap: 5px; }
      .tag-filter-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 5px 12px;
        margin: 1px 0 3px;
        color: var(--muted);
        font-size: 0.62rem;
        font-weight: 800;
      }

      .tag-filter-legend span { display: inline-flex; align-items: center; gap: 5px; }
      .tag-filter-legend .is-neutral-state { color: var(--faint); }
      .tag-color-box {
        width: 11px;
        height: 11px;
        flex: 0 0 11px;
        border: 1px solid #4d4358;
        border-radius: 3px;
        background: #17121d;
      }

      .tag-color-box.is-included { border-color: var(--accent); background: #ffb21f; }
      .tag-color-box.is-excluded {
        border-color: #ff263d;
        background: #d90020;
        box-shadow: 0 0 7px rgba(255, 20, 55, 0.48);
      }

      .tag-group { display: grid; gap: 3px; }
      .tag-group-title {
        margin: 0;
        color: #ffbd44;
        font-size: 0.52rem;
        font-weight: 950;
        letter-spacing: 0.16em;
        line-height: 1;
        text-transform: uppercase;
      }

      .tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
      .filter-chip {
        min-height: 12px;
        display: inline-flex;
        align-items: center;
        border: 0;
        border-bottom: 1px solid #4d4358;
        border-radius: 0;
        padding: 0 1px;
        background: transparent;
        color: var(--faint);
        font: inherit;
        font-size: 0.66rem;
        font-weight: 900;
        cursor: pointer;
      }

      .filter-chip.is-active { border-color: var(--accent); color: #ffd990; }
      .filter-chip.is-excluded { border-color: #ff263d; color: #ff263d; }

      .filter-status {
        min-height: 1em;
        margin: 0;
        color: #9b8baa;
        font-size: 0.68rem;
        line-height: 1.25;
      }

      .catalog-group, .catalog-group-heading, .plugin-list, .catalog-pagination {
        grid-column: 1 / -1;
        width: 100%;
        min-width: 0;
      }

      .catalog-group { display: grid; gap: 6px; }
      .catalog-group-heading { margin: 4px 0 0; }
      .catalog-group-heading .kicker { margin: 0; }
      .plugin-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(190px, 100%), 230px));
        justify-content: start;
        gap: 7px;
      }

      .plugin-card {
        position: relative;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        min-height: 62px;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr);
        align-items: start;
        gap: 4px 6px;
        border-radius: 8px;
        padding: 6px;
        background: linear-gradient(145deg, rgba(255, 178, 31, 0.055), transparent 44%), var(--panel-soft);
      }

      .plugin-card.is-official {
        border-color: rgba(255, 178, 31, 0.62);
        box-shadow: inset 3px 0 0 var(--accent);
      }

      .plugin-icon {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        object-fit: cover;
        border: 1px solid var(--line);
        background: #05030b;
        align-self: start;
      }

      .plugin-copy { min-width: 0; padding-right: 28px; }
      .plugin-copy h3 { font-size: 0.82rem; line-height: 1.05; }
      .plugin-copy h3, .meta span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta { min-width: 0; display: flex; gap: 5px; margin-top: 2px; color: #ad9bc0; font-size: 0.6rem; font-weight: 800; }
      .meta span { min-width: 0; max-width: 46%; }

      .favorite-button {
        position: absolute;
        top: 5px;
        right: 5px;
        z-index: 1;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 178, 31, 0.28);
        border-radius: 999px;
        padding: 0;
        background: rgba(13, 7, 20, 0.9);
        color: #8d7a9e;
        cursor: pointer;
      }

      .favorite-button::before { content: "\2605"; display: block; font-size: 1.25rem; font-weight: 950; line-height: 1; transform: translateY(-1.5px); }
      .favorite-button.is-active { border-color: rgba(255, 194, 71, 0.74); color: #ffd36a; }

      .official-badge {
        grid-column: 1 / -1;
        justify-self: start;
        border-radius: 999px;
        padding: 2px 7px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #180800;
        font-size: 0.52rem;
        font-weight: 950;
        line-height: 1;
        text-transform: uppercase;
      }

      .site-status {
        grid-column: 1 / -1;
        justify-self: start;
        border: 1px solid rgba(87, 225, 161, 0.4);
        border-radius: 4px;
        padding: 2px 6px;
        color: #94f2c5;
        background: rgba(37, 156, 101, 0.18);
        font-size: 0.52rem;
        font-weight: 900;
        line-height: 1;
        text-transform: uppercase;
      }

      .tag-list {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 3px;
        margin-top: -1px;
        min-width: 0;
      }

      .tag-list span {
        width: max-content;
        max-width: 100%;
        overflow-wrap: anywhere;
        border: 1px solid rgba(255, 178, 31, 0.32);
        border-radius: 999px;
        padding: 1px 5px;
        color: #120700;
        background: linear-gradient(135deg, #ffc247, #ff9630);
        font-size: 0.52rem;
        font-weight: 850;
        line-height: 1.05;
      }

      .plugin-actions {
        min-width: 0;
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
      }

      .plugin-actions .button {
        flex: 1 1 0;
        width: auto;
        min-width: 0;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 20px;
        border-radius: 7px;
        padding: 0 7px;
        font-size: 0.64rem;
      }

      .empty, .error { margin: 6px 0 0; color: var(--muted); font-size: 0.78rem; }
      .error { color: #ff9c9c; }
      .catalog-pagination {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 5px;
        margin-top: 4px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      .catalog-pagination[hidden] { display: none; }
      .catalog-pagination button {
        min-width: 32px;
        min-height: 30px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.045);
        color: var(--text);
        font: inherit;
        font-size: 0.7rem;
        font-weight: 850;
        cursor: pointer;
      }

      .catalog-pagination button[aria-current="page"] { border-color: var(--accent); background: var(--accent); color: #211400; }
      .catalog-pagination button:disabled { cursor: default; opacity: 0.5; }

      @media (max-width: 760px) {
        .page { padding: 4px 8px 40px; }
        .topbar { min-height: 28px; flex-wrap: wrap; align-items: flex-start; gap: 6px; margin-bottom: 6px; }
        .brand { width: 100%; }
        .hub-menu { width: 100%; justify-content: flex-start; gap: 13px; overflow-x: auto; scrollbar-width: none; }
        .hub-menu::-webkit-scrollbar { display: none; }
        .menu-tab { font-size: 0.63rem; }
        .kicker { font-size: 0.58rem; letter-spacing: 0.19em; }
        h2 { font-size: 0.95rem; }
        .catalog-panel { gap: 6px; padding: 0; }
        .catalog-search { width: min(320px, 100%); }
        .plugin-list { width: calc(100vw - 16px); grid-template-columns: repeat(2, minmax(0, calc((100vw - 22px) / 2))); gap: 6px; }
        .plugin-card { width: 100%; min-height: 64px; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 6px; border-radius: 9px; padding: 5px; }
        .plugin-icon { width: 28px; height: 28px; }
        .plugin-copy h3 { font-size: 0.82rem; }
        .tag-list span { padding: 1px 5px; }
        .plugin-actions .button { max-width: 108px; }
      }

      @media (max-width: 300px) {
        .plugin-list { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <a class="brand" href="../" aria-label="KapiTomo">
          <img src="../assets/kapitomo-logo.png" alt="">
          <span>KapiTomo</span>
        </a>
        <nav class="hub-menu" aria-label="Catalog navigation" data-i18n-aria="nav.label">
          <a class="menu-tab is-active" href="./" aria-current="page" data-i18n="nav.catalog">Catalog</a>
          <a class="menu-tab" href="../nyxovira/plugin-api/" data-i18n="nav.api">Plugin API</a>
          <div class="language-switch" aria-label="Language">
            <button class="language-button" type="button" data-language-option="en" aria-pressed="true">EN</button>
            <button class="language-button" type="button" data-language-option="pt" aria-pressed="false">PT</button>
          </div>
        </nav>
      </header>

      <section class="panel catalog-panel" aria-labelledby="catalogTitle">
        <div class="panel-head">
          <p class="kicker" data-i18n="catalog.kicker">Catalog</p>
          <h2 id="catalogTitle" data-i18n="catalog.title">Published plugins</h2>
        </div>

        <div class="catalog-tools">
          <div class="catalog-search-row">
            <input id="pluginSearchInput" class="text-input catalog-search" type="search" autocomplete="off" placeholder="Search plugins" aria-label="Search plugins" data-i18n-placeholder="catalog.search" data-i18n-aria="catalog.search">
            <button id="favoritesOnlyButton" class="button favorites-toggle" type="button" aria-pressed="false" data-i18n="catalog.favoritesOnly">Favorites only</button>
          </div>
          <div class="filter-head">
            <p class="kicker" data-i18n="catalog.categories">Categories</p>
          </div>
          <div class="tag-filter-legend" aria-label="Tag color meanings" data-i18n-aria="catalog.tagLegend">
            <span class="is-neutral-state"><i class="tag-color-box" aria-hidden="true"></i><span data-i18n="catalog.tagNeutral">No filter</span></span>
            <span><i class="tag-color-box is-included" aria-hidden="true"></i><span data-i18n="catalog.tagIncluded">Include tag</span></span>
            <span><i class="tag-color-box is-excluded" aria-hidden="true"></i><span data-i18n="catalog.tagExcluded">Exclude tag</span></span>
          </div>
          <div id="tagFilter" class="tag-filter" aria-label="Catalog tag filters" data-i18n-aria="catalog.tagFilters"></div>
          <p id="tagFilterStatus" class="filter-status" aria-live="polite"></p>
        </div>

        <section class="catalog-group" aria-labelledby="officialCatalogHeading">
          <div class="catalog-group-heading">
            <p id="officialCatalogHeading" class="kicker" data-i18n="catalog.officialPlugin">Official plugin</p>
          </div>
          <div id="pluginList" class="plugin-list" aria-live="polite">
            <p data-i18n="catalog.loading">Loading catalog...</p>
          </div>
        </section>
        <nav id="catalogPagination" class="catalog-pagination" aria-label="Catalog pages" data-i18n-aria="catalog.paginationLabel" hidden></nav>
      </section>
    </main>
    <script src="catalog-pagination.js?v=20260910-layout-restored"></script>
    <script src="store.js?v=20260910-layout-restored"></script>
  </body>
</html>
