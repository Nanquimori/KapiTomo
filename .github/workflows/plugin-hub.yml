name: Plugin Hub

on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plugin-hub-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  update-catalog:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[plugin]') || startsWith(github.event.issue.title, '[plugin-remove]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Process plugin request
        run: node tools/plugin-hub-action.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLUGIN_HUB_MAIN_BRANCH: main
          PLUGIN_HUB_PAGES_BRANCH: gh-pages
