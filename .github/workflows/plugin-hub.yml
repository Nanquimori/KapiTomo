name: Plugin Hub

on:
  issues:
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plugin-hub-${{ github.event.issue.number || github.event_name }}
  cancel-in-progress: true

jobs:
  update-catalog:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[plugin]') || startsWith(github.event.issue.title, '[plugin-remove]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Prepare current antivirus signatures
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[plugin]')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout
          clamscan --version

      - name: Process plugin request
        run: node tools/plugin-hub-action.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLUGIN_HUB_MAIN_BRANCH: main
          PLUGIN_HUB_PAGES_BRANCH: gh-pages
